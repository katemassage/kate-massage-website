<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | Kate Massage</title>
<meta name="description" content="Explore the Kate Massage photo gallery.">
<meta name="theme-color" content="#11100e">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #11100e;
    color: #f5eee2;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 45px 20px 30px;
}

header h1 {
    color: #d6b574;
    font-family: Georgia, serif;
    font-size: 38px;
    margin-bottom: 12px;
}

header p {
    color: #c9c0b2;
    font-size: 15px;
    line-height: 1.6;
}

.back-link {
    display: inline-block;
    margin-top: 22px;
    padding: 12px 24px;
    border: 1px solid #d6b574;
    border-radius: 30px;
    color: #d6b574;
    text-decoration: none;
    transition: 0.3s;
}

.back-link:hover {
    background: #d6b574;
    color: #11100e;
}

.gallery {
    max-width: 1100px;
    margin: 20px auto 60px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.gallery img {
    width: 100%;
    height: 340px;
    object-fit: cover;
    display: block;
    border-radius: 12px;
    border: 1px solid rgba(214, 181, 116, 0.4);
    cursor: pointer;
    transition: transform 0.3s;
}

.gallery img:hover {
    transform: scale(1.02);
}

.lightbox {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    background: rgba(0, 0, 0, 0.95);
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.lightbox img {
    max-width: 95%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 8px;
}

.close {
    position: absolute;
    top: 20px;
    right: 30px;
    color: white;
    font-size: 40px;
    cursor: pointer;
}

footer {
    text-align: center;
    padding: 25px 15px;
    color: #a99d8c;
    border-top: 1px solid rgba(214, 181, 116, 0.2);
    font-size: 13px;
}

@media (max-width: 650px) {
    header h1 {
        font-size: 30px;
    }

    .gallery {
        grid-template-columns: 1fr;
        gap: 15px;
    }

    .gallery img {
        height: 300px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Kate Massage Gallery</h1>
    <p>Explore our gallery and discover the Kate Massage experience.</p>
    <a class="back-link" href="index.html">← Back to Home</a>
</header>

<main class="gallery">
    <img src="IMG_2376.jpeg" alt="Kate Massage gallery photo 1" onclick="openLightbox(this)">
    <img src="IMG_2377.jpeg" alt="Kate Massage gallery photo 2" onclick="openLightbox(this)">
    <img src="IMG_2412.webp" alt="Kate Massage gallery photo 3" onclick="openLightbox(this)">
    <img src="IMG_2413.jpeg" alt="Kate Massage gallery photo 4" onclick="openLightbox(this)">
</main>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <span class="close">&times;</span>
    <img id="lightboxImage" src="" alt="Enlarged gallery photo">
</div>

<footer>
    © 2026 Kate Massage. All Rights Reserved.
</footer>

<script>
function openLightbox(image) {
    document.getElementById("lightboxImage").src = image.src;
    document.getElementById("lightbox").style.display = "flex";
}

function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
}
</script>

</body>
</html>
