<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kate Massage | Gallery</title>

<meta name="description" content="Explore the Kate Massage luxury massage and wellness gallery.">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #101010;
    color: #f5f0e6;
    font-family: Arial, sans-serif;
}

header {
    text-align: center;
    padding: 35px 15px 20px;
}

.logo {
    color: #d6b46a;
    font-family: Georgia, serif;
    font-size: 30px;
    letter-spacing: 3px;
}

.subtitle {
    color: #c9c1b2;
    font-size: 12px;
    letter-spacing: 4px;
    margin-top: 10px;
    text-transform: uppercase;
}

.hero {
    width: 100%;
    max-width: 1050px;
    margin: 20px auto 35px;
    padding: 0 15px;
}

.hero img {
    width: 100%;
    height: 430px;
    object-fit: cover;
    display: block;
    border-radius: 8px;
    border: 1px solid #b99a5b;
}

.collection {
    text-align: center;
    padding: 10px 15px 30px;
}

.collection h1 {
    color: #d6b46a;
    font-family: Georgia, serif;
    font-size: 32px;
    margin-bottom: 12px;
}

.collection p {
    color: #c9c1b2;
    font-size: 14px;
    line-height: 1.7;
}

.gallery {
    max-width: 1100px;
    margin: auto;
    padding: 15px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.gallery-item {
    overflow: hidden;
    border-radius: 8px;
    background: #1b1b1b;
    border: 1px solid #8f7545;
}

.gallery-item img {
    width: 100%;
    height: 320px;
    object-fit: cover;
    display: block;
    cursor: pointer;
    transition: transform 0.4s ease;
}

.gallery-item img:hover {
    transform: scale(1.04);
}

.caption {
    text-align: center;
    padding: 14px 8px;
    color: #d6b46a;
    font-family: Georgia, serif;
    font-size: 17px;
}

.back {
    text-align: center;
    padding: 40px 15px;
}

.back a {
    display: inline-block;
    text-decoration: none;
    color: #101010;
    background: #d6b46a;
    padding: 14px 30px;
    border-radius: 4px;
    font-size: 13px;
    letter-spacing: 1px;
    font-weight: bold;
}

.back a:hover {
    background: #f0d18d;
}

footer {
    text-align: center;
    padding: 25px 10px;
    border-top: 1px solid #4b402d;
    color: #aaa08e;
    font-size: 12px;
}

.lightbox {
    display: none;
    position: fixed;
    z-index: 999;
    inset: 0;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.lightbox img {
    max-width: 95%;
    max-height: 90vh;
    object-fit: contain;
    border: 1px solid #d6b46a;
}

@media (max-width: 650px) {
    .hero img {
        height: 280px;
    }

    .collection h1 {
        font-size: 26px;
    }

    .gallery {
        grid-template-columns: 1fr;
    }

    .gallery-item img {
        height: 280px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">KATE MASSAGE</div>
    <div class="subtitle">Luxury Massage & Wellness</div>
</header>

<!-- MAIN FEATURED PICTURE -->
<section class="hero">
    <img
        src="IMG_2376.jpeg"
        alt="Kate Massage featured collection"
        onclick="openImage(this.src)"
    >
</section>

<!-- COLLECTION TITLE -->
<section class="collection">
    <h1>The Kate Massage Collection</h1>
    <p>
        Discover the beauty of relaxation, comfort and wellness.
        Explore the Kate Massage gallery.
    </p>
</section>

<!-- GALLERY PICTURES -->
<section class="gallery">

    <div class="gallery-item">
        <img src="IMG_2377.jpeg"
             alt="Kate Massage Gallery"
             onclick="openImage(this.src)">
        <div class="caption">Relaxation & Wellness</div>
    </div>

    <div class="gallery-item">
        <img src="IMG_2412.webp"
             alt="Kate Massage Gallery"
             onclick="openImage(this.src)">
        <div class="caption">The Massage Experience</div>
    </div>

    <div class="gallery-item">
        <img src="IMG_2413.jpeg"
             alt="Kate Massage Gallery"
             onclick="openImage(this.src)">
        <div class="caption">Luxury & Comfort</div>
    </div>

</section>

<div class="back">
    <a href="index.html">BACK TO HOME</a>
</div>

<footer>
    © 2026 Kate Massage. All Rights Reserved.
</footer>

<!-- IMAGE LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeImage()">
    <img id="lightboxImage" src="" alt="Enlarged gallery image">
</div>

<script>
function openImage(src) {
    document.getElementById("lightboxImage").src = src;
    document.getElementById("lightbox").style.display = "flex";
}

function closeImage() {
    document.getElementById("lightbox").style.display = "none";
}
</script>

</body>
</html>
